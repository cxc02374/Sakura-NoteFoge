name: Build & Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver.StartsWith("v")) { $ver = $ver.Substring(1) }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build EXE
        shell: pwsh
        run: |
          Write-Host "Workspace: $PWD"
          Get-ChildItem .
          if (-not (Test-Path "assets\noteforge_icon.ico")) { throw "icon not found" }
          if (-not (Test-Path "run_noteforge_entry.py")) { throw "entry script not found" }
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --name SakuraNoteForge `
            --windowed `
            --distpath dist/windows `
            --workpath build/windows `
            --icon assets/noteforge_icon.ico `
            --add-data "assets;assets" `
            --collect-all markdown `
            --collect-all pygments `
            run_noteforge_entry.py

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Build Installer
        run: |
          $IsccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $IsccPath)) { $IsccPath = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $IsccPath "/DAppVersion=${{ steps.version.outputs.version }}" "installer\SakuraNoteForge.iss"
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
