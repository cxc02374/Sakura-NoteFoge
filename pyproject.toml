[project]
name = "sakura-noteforge"
version = "0.1.0"
description = "Standalone Markdown editor and preview tool for SakuraMark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "markdown>=3.6",
  "pygments>=2.18",
]

[project.scripts]
sakura-noteforge = "noteforge.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
